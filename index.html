<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LinguaFlow</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Боковая навигация (на телефоне превращается в нижнюю панель) -->
  <aside class="sidebar">
    <div class="brand">LinguaFlow</div>
    <nav class="nav">
      <button class="nav-btn active" data-go="dashboard">
        <svg viewBox="0 0 24 24"><path d="M4 11l8-6 8 6v8H4z"/></svg>
        <span>Главная</span>
      </button>
      <button class="nav-btn" data-go="words">
        <svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h9"/></svg>
        <span>Мой словарь</span>
      </button>
      <button class="nav-btn" data-go="library">
        <svg viewBox="0 0 24 24"><rect x="4" y="5" width="6" height="14" rx="1.5"/><rect x="14" y="5" width="6" height="14" rx="1.5"/></svg>
        <span>Библиотека</span>
      </button>
      <button class="nav-btn" data-go="practice">
        <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="3"/><path d="M9 12h6"/></svg>
        <span>Тренировка</span>
      </button>
      <button class="nav-btn" data-go="assistant">
        <svg viewBox="0 0 24 24"><path d="M5 6h14v9h-9l-5 4z"/></svg>
        <span>ИИ-помощник</span>
      </button>
    </nav>
  </aside>

  <main class="main">
    <section class="page active" id="page-dashboard"><div id="dashboard"></div></section>

    <section class="page" id="page-words">
      <div class="page-head">
        <h1 class="page-title">Мой словарь</h1>
        <button class="btn btn-primary" data-action="add">Добавить слово</button>
      </div>
      <p class="muted stats" id="stats"></p>
      <div class="toolbar">
        <input type="search" id="search" placeholder="Поиск по слову или переводу">
        <select id="filterLevel"></select>
        <select id="filterPos"></select>
        <select id="filterCol"></select>
      </div>
      <ul class="word-list" id="wordList"></ul>
      <button class="btn reset" id="resetBtn">Сбросить к демо-данным</button>
    </section>

    <section class="page" id="page-library"><div id="library"></div></section>

    <section class="page" id="page-practice">
      <div class="tabs mode-tabs">
        <button class="tab active" data-mode="cards">Карточки</button>
        <button class="tab" data-mode="test">Тест</button>
      </div>
      <div id="cardsMode">
      <div class="progress-row">
        <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
        <span class="progress-text" id="progressText"></span>
      </div>

      <div id="practiceBody">
        <div class="card" id="card">
          <div class="card-inner">
            <div class="card-face card-front">
              <span class="tag" id="frontPos"></span>
              <h1 class="card-word" id="frontWord"></h1>
              <p class="card-ipa" id="frontIpa"></p>
            </div>
            <div class="card-face card-back">
              <h2 class="card-translation" id="backTranslation"></h2>
              <p class="card-explanation" id="backExplanation"></p>
              <div class="example">
                <p id="backExample"></p>
                <p class="muted" id="backExampleRu"></p>
              </div>
            </div>
          </div>
        </div>

        <div class="actions">
          <button class="btn btn-primary" id="flipBtn">Показать перевод</button>
          <div class="rating" id="rating" hidden></div>
        </div>
        <p class="muted hint">Пробел — перевернуть карточку, 1 / 2 / 3 — оценка</p>
      </div>

      <div class="finish" id="finish" hidden>
        <h2 id="finishTitle">Тренировка завершена</h2>
        <p class="muted" id="finishText"></p>
        <button class="btn btn-primary" id="restartBtn">Повторить все слова</button>
      </div>
      </div>
      <div id="testMode" hidden></div>
    </section>

    <section class="page" id="page-assistant"><div id="assistant"></div></section>
  </main>

  <dialog id="modal"></dialog>
  <div class="toast" id="toast" role="status"></div>

  <script src="js/data.js"></script>
  <script src="js/core.js"></script>
  <script src="js/practice.js"></script>
  <script src="js/test.js"></script>
  <script src="js/vocabulary.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/library.js"></script>
  <script src="js/assistant.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
